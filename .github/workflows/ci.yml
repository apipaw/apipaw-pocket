name: APIPaw Pocket CI

# 阶段二十三 P0 · 把 Pocket 仓的**纯本地单测 + 类型检查 + Web 构建 + 体积闸门**
# 锁进 GitHub Actions。
#
# 之前的问题（2026-11-20 审计 §"工程纪律只在人脑里"）：
#   本仓库的 e2e/ 下有 30+ 个脚本，但**没有一个在 CI 里跑过**；
#   更要紧的是 —— `expo export` 的产物是**部署到源站的那份静态文件**，
#   体积是硬指标（两站 gzip < 340KB，阶段二十五 P2 收紧），此前每次发布都靠人工目测。
#   ⇒ "打包成功"和"体积达标"必须由机器判定。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apipaw-pocket-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build + Test (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ Node 版本说明（阶段二十三 CI 踩坑）：
      #   `e2e/unit-*.mjs` 直接 `import ../src/**/*.ts` —— 依赖 **原生类型剥离**，
      #   该能力自 Node 22.18 起默认开启（Node 20 会直接报
      #   ERR_UNKNOWN_FILE_EXTENSION ".ts"）。
      #   故 CI 用 Node 22（LTS，Expo SDK 58 官方支持区间 20/22）。
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Local unit tests (纯本地，无需网络/浏览器)
        # 阶段二十五 P2 新增 `e2e/unit-qrcode.mjs`（手写二维码编码器 vs 独立参照实现
        # 逐模块比对）—— 已被下面的 `e2e/unit-*.mjs` 通配符自动纳入，
        # 无需再单独登记一行（新增用例只要遵守命名约定即自动进 CI）。
        run: |
          set -o pipefail
          status=0
          for f in e2e/unit-*.mjs; do
            echo "::group::$f"
            if ! node "$f"; then
              echo "::error::$f failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Web export
        run: npm run build:web

      - name: Gzip precompress
        run: npm run build:web:gzip

      - name: Assert gzipped bundle < 340KB
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          // 阶段二十五 P2：把闸门从 400KB 收紧到 340KB（当前实测 329.4KB），
          // 让"体积达标"由机器判定，而不是靠人工目测。
          const LIMIT = 340 * 1024;
          const root = path.join(process.cwd(), 'dist');
          if (!fs.existsSync(root)) { console.error('[FATAL] 没有 dist 产物'); process.exit(1); }
          const files = [];
          (function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir, name);
              const st = fs.statSync(p);
              if (st.isDirectory()) walk(p);
              else if (name.endsWith('.gz')) files.push({ p, size: st.size });
            }
          })(root);
          if (!files.length) { console.error('[FATAL] 没有生成 .gz 预压缩产物'); process.exit(1); }
          files.sort((a, b) => b.size - a.size);
          const biggest = files[0];
          console.log(`[info] 最大的 gz 产物: ${biggest.p} = ${(biggest.size / 1024).toFixed(1)} KB`);
          if (biggest.size >= LIMIT) {
            console.error(`[FATAL] 主 bundle 压缩后 ${(biggest.size / 1024).toFixed(1)} KB ≥ 340 KB`);
            process.exit(1);
          }
          console.log(`[ok] 主 bundle 压缩后 ${(biggest.size / 1024).toFixed(1)} KB < 340 KB`);
          JS

  # 阶段二十六 P1 · 双站 CSP 线上快检（advisory）
  #
  # ⚠️ 诚实口径：这一档是**线上巡检**，依赖 runner 到生产域名的网络可达性 ——
  #    网络抖动会造出**假红**，所以用 continue-on-error 降级为告警，
  #    不让它阻塞主干。真正的**硬闸**在上面的 `e2e/unit-csp-policy.mjs`
  #    （静态校验仓库真源 deploy/nginx/*.conf：每个 location 都挂 CSP、
  #     两个 server 块都挂源站白名单）。
  online-csp:
    name: Online CSP header check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert both sites serve Content-Security-Policy
        run: node e2e/csp-header-check.mjs

  # 阶段二十七 P0 · 移动端布局反碰撞回归（advisory）
  #
  # ⚠️ 诚实口径：这一档需要**下载 Chromium**（~150MB），CI 时长与网络抖动都会放大，
  #    所以同样用 continue-on-error 降级为告警，不阻塞主干。
  #    它的价值在于「每次 PR 都能看到一份反碰撞报告」，而不是当硬闸。
  #    本地硬验证：npm run build:web && node e2e/mobile-layout.cjs（退出码 1 = 有碰撞）
  mobile-layout:
    name: Mobile layout anti-collision (advisory)
    # ⚠️ 必须钉 ubuntu-24.04 —— ubuntu-latest 现在是 26.04，
    #    而 playwright 1.59.1 尚未提供 ubuntu26.04-x64 的 chromium 构建
    #    （`npx playwright install` 会直接报 "Playwright does not support
    #     chromium on ubuntu26.04-x64"）。
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.59.1
          npx playwright install --with-deps chromium
      - name: Web export
        run: npm run build:web
      - name: Mobile layout audit (390x844 / 375x812)
        run: node e2e/mobile-layout.cjs

  # 阶段二十八 P0 · 移动端 Playground 体验精修回归（advisory）
  #
  # 覆盖 4 处移动端缺陷：① 模型弹层不透明 ② 默认落在线模型 + 离线折叠分组
  # ③ 窄屏配置折叠 / 对话区变大 / 账单小票折叠 ④ KPI 指标卡零省略号。
  #
  # ⚠️ 同样是 **advisory**：它依赖 Chromium 下载与一台空闲的 8081 端口，
  #    抖动会造出假红；真正的硬闸仍是上面的 typecheck / unit-*.mjs / gzip 体积。
  mobile-playground-ux:
    name: Mobile Playground UX regression (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.59.1
          npx playwright install --with-deps chromium
      - name: Web export
        run: npm run build:web
      - name: Mobile Playground UX audit (390x844 / 375x812)
        run: node e2e/mobile-playground-ux.cjs
