# APIPaw 前端站点 —— console / pocket 双域名物理隔离
#
# 变更记录（2026-11-08，阶段三）：
#   此前 console.apipaw.com 与 pocket.apipaw.com 共用同一个 server 块与
#   同一个 root（/var/www/apipaw-pocket），任一次部署都会同时覆盖两个域名。
#   现拆分为两个独立 server 块 + 两个独立站点根目录，两者可各自独立构建、
#   部署与回滚，互不影响。
#
#   备份：/root/apipaw-console.conf.bak-20261108-025824-split
#   约定：nginx 改动一律 nginx -t 后 `systemctl reload nginx`，禁止 restart。
#
# 追加（2026-11-16，阶段十一 P0）：两个 server 块均启用 `gzip_static on;`
#   —— 配合发布流程里的 `npm run build:web:release`（expo export + 预压缩 .gz），
#      1.45MB 的 bundle 直接以 420KB 的 .gz 下发，传输量下降 ~72%。
#
#   追加：全局 access.log 不含 $host，分流后无法区分域名，故按站点独立出日志，
#         并记录 $request_time / $upstream_response_time 供 CF 链路抖动定位。

log_format apipaw_site '$time_iso8601 host=$host "$request" $status bytes=$body_bytes_sent '
                       'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time '
                       'cf=$http_cf_connecting_ip xff=$http_x_forwarded_for';

# ---------- Pocket（v1.1.0 暗黑科幻重构主站） ----------
server {
    listen 80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pocket.apipaw.com;

    root /var/www/apipaw-pocket;
    index index.html;

    access_log /var/log/nginx/apipaw-pocket.access.log apipaw_site;
    error_log  /var/log/nginx/apipaw-pocket.error.log warn;

    ssl_certificate     /etc/nginx/ssl/apipaw-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/apipaw-origin.key;

    # ---- 阶段二十六 P0 · 源站来源白名单（R-02：443 直连绕过 Cloudflare）----
    # 与 cloud.apipaw.com 同口径：只有 Cloudflare 回源 IP + 本机 127.0.0.1 能打到源站，
    # 其余来源（直接用 https://103.142.190.251 + 伪造 Host 头）一律 403。
    # ⚠️ allow/deny 属于「访问控制」指令：server 级声明会被 location 级整体替换，
    #    所以必须放在 server 块内（不能放 http 层，否则会波及 cloud vhost）。
    # ⚠️ 白名单由 /usr/local/bin/apipaw_sync_cf_ips.sh 每周自动重生成（cron 17 3 * * 0）。
    include /etc/nginx/cf-origins.allow;
    allow 127.0.0.1;
    deny all;

    gzip on;
    gzip_static on;          # 阶段十一 P0 · 命中预压缩 .gz（省掉运行时压缩）
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /_expo/static/ {
        include /etc/nginx/apipaw-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/apipaw-csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

# ---------- Console（独立根目录，内容当前与 Pocket 同版本） ----------
server {
    listen 80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.apipaw.com;

    root /var/www/apipaw-console;
    index index.html;

    access_log /var/log/nginx/apipaw-console.access.log apipaw_site;
    error_log  /var/log/nginx/apipaw-console.error.log warn;

