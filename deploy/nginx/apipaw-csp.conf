# 阶段二十六 P1 · 双站 Content-Security-Policy（R-15）
#
# 部署位置：源站 `/etc/nginx/apipaw-csp.conf`
# 引用位置：`/etc/nginx/conf.d/apipaw-console.conf` 的**每一个 location**
#
# ⚠️ 为什么必须逐 location include（nginx 的坑）：
#   `add_header` 是「就近覆盖」语义 —— location 块里只要出现**任意一条** add_header，
#   server 级继承下来的 add_header 就**全部作废**。
#   本 vhost 的两个 location 各自都有 `add_header Cache-Control ...`，
#   所以 CSP 若只写在 server 级，实际**一个响应都带不上**。
#
# 口径说明（为什么这样配）：
#   · script-src 'self' —— Expo Web 产物 index.html 只引外部 bundle，无内联脚本
#     （已核 dist/index.html：无 inline <script>），故不放 'unsafe-inline'。
#   · style-src 带 'unsafe-inline' —— index.html 有内联 <style> 块，
#     且 react-native-web 大量使用 style 属性内联样式。
#   · script-src / connect-src 额外放行 https://static.cloudflareinsights.com ——
#     那是 Cloudflare 在边缘注入的 Web Analytics 探测脚本（RUM beacon），
#     不放行它会在浏览器控制台留下 CSP 拦截报错（本站自身代码不依赖它）。
#   · connect-src 的 cloud.apipaw.com 是前端唯一后端出口（src/api/cloudClient.ts
#     的 FALLBACK_BASE_URL），前端不使用 WebSocket / EventSource。
#   · frame-ancestors 'none' + X-Frame-Options DENY（cloud vhost 已有）保持一致。
#   · img/font 允许 data: —— RN Web 的内联图标与 base64 图片。

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cloud.apipaw.com https://static.cloudflareinsights.com; manifest-src 'self'; worker-src 'self' blob:" always;
